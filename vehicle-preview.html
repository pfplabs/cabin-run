<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northbound — Pickup model review</title>
<style>body{margin:0;background:#202828;color:#e5e6df;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{font-size:23px;font-weight:500;margin:8px 0}small{letter-spacing:.15em;text-transform:uppercase;color:#b4beb4}footer{position:absolute;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;color:#c2cbc2;pointer-events:none}nav{position:absolute;right:28px;top:28px;display:flex;gap:8px}button,a{background:#ffffff12;border:1px solid #ffffff30;color:#eef1eb;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}.caption{max-width:430px;font-size:13px;line-height:1.5;color:#bdc7bc}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<header><small>Northbound / model review</small><h1>Black expedition pickup</h1><div class="caption">Reference-led work in progress · Open cargo bed, rollover bars and roof/front auxiliary lamps. Drag to orbit; scroll to inspect.</div></header>
<nav><button id="front">Front</button><button id="rear">Cargo bed</button><button id="side">Side profile</button><a href="./?qa=1">Play cabin build ↗</a></nav><footer><span id="status">Loading model…</span><span>Tacoma-style pickup direction · Unbranded</span></footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';import {HDRLoader} from './vendor/loaders/HDRLoader.js';import {OrbitControls} from './vendor/controls/OrbitControls.js';import {applyVehicleFidelity} from './vehicle-fidelity.js';import {applyJeepBody} from './jeep-body.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x283330);scene.fog=new THREE.Fog(0x283330,24,55);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.05,100);camera.position.set(7,4,-8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.15,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xd8e5ef,0x414638,1));const key=new THREE.DirectionalLight(0xffe8c8,2.5);key.position.set(-4,7,-5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=key.shadow.camera.bottom=-5;key.shadow.camera.right=key.shadow.camera.top=5;key.shadow.normalBias=.025;key.shadow.bias=-.0001;scene.add(key);const fill=new THREE.DirectionalLight(0xaac5e4,1.4);fill.position.set(4,4,3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x4e5750,roughness:.87}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const pmrem=new THREE.PMREMGenerator(renderer);new HDRLoader().load('./assets/pbr/blouberg_sunrise_2_1k.hdr',hdr=>{scene.environment=pmrem.fromEquirectangular(hdr).texture;scene.environmentIntensity=.75;hdr.dispose();});
let stats;new GLTFLoader().load('./assets/northbound.glb',g=>{applyVehicleFidelity(g.scene);stats=applyJeepBody(g.scene);const truck=g.scene.getObjectByName('JeepRoot');truck.position.set(0,-.06,0);truck.rotation.set(0,0,0);scene.add(truck);truck.traverse(o=>{if(o.isMesh){o.castShadow=o.material.transparent?false:true;o.receiveShadow=true;}});document.querySelector('#status').textContent=`Model loaded · ${stats.triangles.toLocaleString()} body triangles · 8 body materials`;},undefined,e=>{document.querySelector('#status').textContent='Model failed to load';console.error(e)});
const view=(x,y,z)=>{camera.position.set(x,y,z);controls.target.set(0,1.1,0);controls.update();};document.querySelector('#front').onclick=()=>view(7,4,-8);document.querySelector('#rear').onclick=()=>view(6,4.8,8);document.querySelector('#side').onclick=()=>view(9,2.8,.1);
let frames=0,then=performance.now();function frame(now){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);frames++;if(now-then>1500&&stats){document.querySelector('#status').textContent=`Model loaded · ${stats.triangles.toLocaleString()} body triangles · ${Math.round(frames*1000/(now-then))} FPS`;frames=0;then=now;}}requestAnimationFrame(frame);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
