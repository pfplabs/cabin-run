<!doctype html><html><head><meta charset="utf-8"><title>River cascade verification</title><style>body{margin:0;background:#213038;color:white;font:14px system-ui}pre{position:absolute;left:16px;top:10px;background:#172128cc;padding:12px}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script></head><body><pre id="stats">Compiling water shaders…</pre><script type="module">
import * as THREE from 'three';
import {createWaterfallBridge,gorgeHeight} from '../waterfall-bridge.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#9baeb0');scene.fog=new THREE.Fog('#9baeb0',150,400);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,1000);camera.position.set(52,37,937);camera.lookAt(0,29,991);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcde0ec,0x4c5340,2));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(45,90,960);scene.add(sun);
const river=createWaterfallBridge();scene.add(river);
const g=new THREE.PlaneGeometry(130,390,90,180);g.rotateX(-Math.PI/2);const a=g.attributes.position;for(let i=0;i<a.count;i++){const x=a.getX(i),z=a.getZ(i)+865;const base=2+62/(1+Math.exp(-(z-984)/9));a.setXYZ(i,x,gorgeHeight(x,z,base),z);}g.computeVertexNormals();const terrain=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x686b52,roughness:1}));scene.add(terrain);
let frame=0,last=0;const samples=[];function draw(t){river.update(t/1000);renderer.render(scene,camera);if(last&&frame>30)samples.push(t-last);last=t;frame++;if(frame===220){const sort=[...samples].sort((a,b)=>a-b);document.querySelector('#stats').textContent=JSON.stringify({frames:samples.length,meanFrameMs:samples.reduce((a,b)=>a+b,0)/samples.length,p95FrameMs:sort[Math.floor(sort.length*.95)],calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,programs:renderer.info.programs.length,animationTime:river.userData.time.value},null,2);document.title='River verified';}if(frame<240)requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
